services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hisaab
      POSTGRES_PASSWORD: hisaab_dev
      POSTGRES_DB: hisaab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
